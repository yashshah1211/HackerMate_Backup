name: Daily Database Activity PDF Digest

on:
  schedule:
    # Runs every day at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  send-database-activity-digest:
    name: Send Database Activity PDF Report
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Database Activity Endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://www.hackermate.in' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          
          echo "Triggering Database Activity Digest report at 9:00 AM IST on $SITE_URL..."
          
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$SITE_URL/api/cron/database-activity-report")
            
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to generate database activity report. Status: $HTTP_STATUS"
            exit 1
          fi
          
          echo "HackerMate Database Activity PDF email successfully delivered!"
