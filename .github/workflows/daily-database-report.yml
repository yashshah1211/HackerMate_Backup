name: Daily Database Activity PDF Digest

on:
  schedule:
    # Daily 09:07 IST; re-register the missed schedule without enabling Vercel cron.
    - cron: '37 3 * * *'
  workflow_dispatch: # Manual run remains available but report endpoint is single-send guarded
  # One-time founder-authorized live verification on November 6. Remove after run.
  # Only a main-branch workflow-file change with the guarded merge title triggers it.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-database-report.yml'

permissions:
  contents: read

concurrency:
  group: hackermate-database-activity-report
  cancel-in-progress: false

jobs:
  send-database-activity-digest:
    name: Send Database Activity PDF Report
    if: github.repository == 'yashshah1211/HackerMate_Backup' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'test(report): one-time Founder Brief delivery verification'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Database Activity Endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${SITE_URL:-https://www.hackermate.in}"
          test -n "$CRON_SECRET" || { echo "::error::Missing CRON_SECRET; no dispatch."; exit 1; }
          # The apex domain redirects to www. curl's cross-host redirect loses
          # the machine Authorization header, causing a 403 from requireAdmin.
          # Normalize BOTH allowed input values to the canonical origin.
          case "$TARGET_URL" in
            https://hackermate.in|https://www.hackermate.in)
              TARGET_URL="https://www.hackermate.in" ;;
            *) echo "::error::Non-production destination refused."; exit 1 ;;
          esac
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          if ! HTTP_STATUS=$(curl -sS --proto '=https' --max-redirs 0 --retry 0 --connect-timeout 15 --max-time 240 -o "$RESPONSE_FILE" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${TARGET_URL}/api/cron/database-activity-report"); then
            echo "::error::Database report request failed; acceptance unknown. Check provider records before resending."
            exit 1
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            if [[ "$HTTP_STATUS" == 3* ]]; then
              echo "::error::Unexpected production redirect (HTTP ${HTTP_STATUS}); refused to forward Authorization. Check canonical domain."
            elif [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
              echo "::error::Report authorization failed (HTTP ${HTTP_STATUS}); check that GitHub and Vercel CRON_SECRET match. No automatic resend."
            else
              echo "::error::Database report request returned HTTP ${HTTP_STATUS}; acceptance not confirmed."
            fi
            exit 1
          fi

          # A 200 may acknowledge sandbox dispatch only. Require the intended
          # recipient's acceptance contract, never delivery or bookkeeping.
          if ! jq -e -s 'length == 1 and (.[0] |
            .success == true and
            .dispatch.status == "accepted" and
            .dispatch.attempted == true and
            .dispatch.intendedRecipientAccepted == true and
            .dispatch.sandbox == false)' "$RESPONSE_FILE" > /dev/null 2>&1; then
            echo "::error::Invalid JSON or rejected/unconfirmed email dispatch. Check provider records before resending."
            exit 1
          fi

          echo "HackerMate Database Activity PDF email accepted by email provider; delivery not confirmed."
