name: Pull Request Validation

# Offline checks only: TypeScript, OAuth return paths, evaluator admission,
# team matching, partner presentation, discovery navigation, authorization and
# certificate verification with synthetic fixtures, query smoke and isolated
# desktop/mobile account-guard Chromium checks. No live DB, AI, email, deployment,
# deployed SQL/RLS, or production end-to-end verification is performed.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: TypeScript and offline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck -- --incremental false --pretty false
      - name: Run offline regression selection
        run: |
          node --import ./qa/fixtures/rack-network-guard.mjs --test --test-concurrency=1 \
            scripts/test-mission02-state.cjs \
            scripts/test-mission03-state.cjs \
            scripts/test-mission03-history-query.cjs \
            scripts/test-stabilization-boundaries.cjs \
            scripts/test-stabilization-ppt-access.cjs \
            scripts/test-stabilization-email-access.cjs \
            scripts/test-stabilization-notification-replay.cjs \
            scripts/test-admin-authorization.cjs \
            scripts/test-daily-report-claim.cjs \
            scripts/test-database-report-workflow.cjs \
            scripts/test-founder-brief.cjs \
            scripts/test-organizer-candidate-discovery.cjs \
            scripts/test-scheduled-organizer-outreach.cjs \
            scripts/test-auth-return-paths.cjs \
            scripts/test-evaluator-generation-admission.cjs \
            scripts/test-feature-retirement.cjs \
            scripts/test-evaluator-reliability.cjs \
            scripts/test-evaluator-result-authority.cjs \
            scripts/test-evaluator-maintenance.cjs \
            scripts/test-ppt-vision.cjs \
            scripts/test-ppt-document-identity.cjs \
            scripts/test-team-creation.cjs \
            scripts/test-squad-matching.cjs \
            scripts/test-partner-presentation.cjs \
            scripts/test-partner-discovery-navigation.cjs \
            scripts/test-partner-authorization.cjs \
            scripts/test-certificate-verification-page.cjs

      - name: Verify workspace permissions and document concurrency in disposable native PostgreSQL
        run: |
          mission03_pg_bin=$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)
          test -n "$mission03_pg_bin"
          export PATH="$mission03_pg_bin:$PATH"
          export PARTNER_TEST_PG_BIN="$mission03_pg_bin"
          node --test scripts/test-mission03-workspace-rls.cjs
          node --test scripts/test-chat-active-actor-local.cjs
          python3 scripts/test-team-document-local.py

      - name: Run existing core-page query smoke against synthetic loopback fixtures
        run: node scripts/run-stabilization-smoke.cjs

      - name: Install Chromium for account-boundary regressions
        run: npx playwright install --with-deps chromium

      - name: Verify account guard in desktop and mobile Chromium with external network blocked
        run: node --import ./qa/fixtures/rack-network-guard.mjs --test --test-concurrency=1 scripts/test-stabilization-browser.cjs scripts/test-mission02-browser.cjs

      - name: Render Founder Brief review artifacts without production data
        run: node scripts/render-founder-brief-preview.cjs
      - name: Upload Founder Brief preview for independent visual QA
        uses: actions/upload-artifact@v4
        with:
          name: founder-brief-review-preview
          path: artifacts/founder-brief-preview/
          retention-days: 7
          if-no-files-found: error
