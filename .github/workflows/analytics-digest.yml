name: Daily Platform Database PDF Digest

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  send-analytics-digest:
    name: Send Platform Database PDF Report
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Analytics Summary Endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://hackermate.in' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          
          echo "Triggering Platform Database Digest report on $SITE_URL..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$SITE_URL/api/cron/analytics-summary")
            
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Report request returned HTTP $HTTP_STATUS; inspect the dispatch outcome before retrying."
            exit 1
          fi
          
          if ! echo "$BODY" | jq -e '.success == true and .dispatch.status == "accepted"' > /dev/null; then
            echo "Provider acceptance was not confirmed. Check the dispatch outcome before retrying."
            exit 1
          fi

          echo "Platform Database Digest accepted by email provider; delivery is not confirmed."
